name: APK bauen

on:
  push:
    branches: [lebensmittel-ampel]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests und APK bauen
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk Lebensmittel-Ampel.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Lebensmittel-Ampel
          path: Lebensmittel-Ampel.apk

      - name: Als Release "Neueste Version" veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete lebensmittel-ampel-neueste --yes --cleanup-tag || true
          gh release create lebensmittel-ampel-neueste Lebensmittel-Ampel.apk \
            --target "${GITHUB_SHA}" \
            --title "Lebensmittel-Ampel (neueste Version)" \
            --notes "Automatisch gebaut aus Commit ${GITHUB_SHA::7}. APK auf dem Handy herunterladen und installieren." \
            --prerelease
